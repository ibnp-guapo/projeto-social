name: CI/CD - Test & Deploy to Hostinger

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Run Automated Tests (PHPUnit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, json, curl
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Execute PHPUnit Test Suite
        run: vendor/bin/phpunit --colors=always

  deploy:
    name: Deploy to Hostinger
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Remote Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST || '185.211.7.156' }}
          port: ${{ secrets.HOSTINGER_PORT || '65002' }}
          username: ${{ secrets.HOSTINGER_USER || 'u451023057' }}
          key: ${{ secrets.HOSTINGER_SSH_KEY || secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY }}
          script_stop: true
          command_timeout: 120s
          script: |
            TARGET_DIR="${HOME}/domains/social.ibnpguapo.org.br/projeto-social"
            if [ -f "${TARGET_DIR}/scripts/deploy_hostinger.sh" ]; then
              bash "${TARGET_DIR}/scripts/deploy_hostinger.sh"
            else
              cd "${TARGET_DIR}"
              git pull origin main
              mkdir -p storage/views_cache storage/data storage/cache
              chmod -R 775 storage
            fi
